name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # GitHub's Windows image can expose an 8.3 alias in TEMP. Workbench
      # deliberately rejects those aliases; use the runner's ordinary path.
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/check.mjs
      - run: npm run build
